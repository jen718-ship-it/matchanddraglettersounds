<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Match</title>
    <!-- Font Awesome for Check and Reset Icon Buttons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
    }

    body {
        margin: 0;
        padding: 16px 20px 22px;
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
        background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
    }

    h1 {
        color: #ff3366;
        font-size: clamp(2.2rem, 5vw, 3rem);
        margin: 6px 0 12px;
        text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.15);
        letter-spacing: 2px;
        text-align: center;
    }

    /* Letter-set buttons */
    .set-selector {
        width: 100%;
        max-width: 900px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 4px 0 10px;
    }

    .set-btn {
        width: 118px;
        height: 54px;
        padding: 4px 8px;
        border: 3px solid rgba(255,255,255,.95);
        border-radius: 16px;
        background: #ffffff;
        cursor: pointer;
        box-shadow: 0 5px 10px rgba(0,0,0,.16);
        transition: transform .18s, box-shadow .18s, border-color .18s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
        font-size: 1.45rem;
        font-weight: bold;
        color: #333;
        white-space: nowrap;
        touch-action: manipulation;
    }

    .set-btn:hover {
        transform: translateY(-2px);
    }

    .set-btn.active {
        border-color: #ff3366;
        box-shadow: 0 0 0 3px rgba(255,51,102,.18), 0 7px 13px rgba(0,0,0,.17);
        transform: scale(1.03);
    }

    .header-container {
        position: relative;
        z-index: 20;
        width: 100%;
        max-width: 900px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 20px;
    }

    .score-board {
        display: flex;
        gap: 20px;
        background: rgba(255,255,255,.88);
        padding: 8px 20px;
        border-radius: 50px;
        box-shadow: 0 8px 15px rgba(0,0,0,.1);
    }

    .score-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.6rem;
        font-weight: bold;
    }

    .score-item.correct { color: #2ecc71; }
    .score-item.wrong { color: #e74c3c; }

    .game-board {
        display: flex;
        flex-direction: column;
        gap: 34px;
        width: 100%;
        max-width: 1000px;
        align-items: center;
        margin: 22px 0 14px;
    }

    .hats-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
        width: 100%;
    }

    .hat-card {
        position: relative;
        width: 150px;
        height: 180px;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform .2s;
        touch-action: manipulation;
    }

    .hat-card:hover {
        transform: scale(1.05);
    }

    .hat-img {
        width: 140px;
        height: 140px;
        object-fit: contain;
        filter: drop-shadow(0 8px 10px rgba(0,0,0,.2));
        z-index: 2;
        pointer-events: none;
    }

    /* The visible answer landing area */
    .drop-zone {
        position: absolute;
        bottom: 0;
        width: 120px;
        height: 80px;
        border: 3px dashed #ff9900;
        border-radius: 15px;
        background: rgba(255,255,255,.5);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color .18s, border-color .18s, transform .18s, box-shadow .18s;
        z-index: 5;
        pointer-events: none;
    }

    .drop-zone.drag-over {
        background: rgba(255,235,59,.88);
        border-color: #ff5722;
        transform: scale(1.12);
        box-shadow: 0 0 0 6px rgba(255,193,7,.22);
    }

    .drop-zone img {
        max-width: 90%;
        max-height: 90%;
        object-fit: contain;
        pointer-events: none;
        position: relative;
        z-index: 6;
        filter: drop-shadow(0 3px 3px rgba(0,0,0,.18));
    }

    .revealed-letter {
        position: absolute;
        top: -50px;
        width: 80px;
        height: 80px;
        opacity: 0;
        transform: translateY(20px);
        transition: all .5s cubic-bezier(.175,.885,.32,1.275);
        z-index: 8;
        pointer-events: none;
    }

    .revealed-letter img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .hat-card.revealed .revealed-letter {
        opacity: 1;
        transform: translateY(0);
    }

    .result-icon {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 2.5rem;
        z-index: 4;
        opacity: 0;
        transform: scale(0);
        transition: transform .3s ease;
        pointer-events: none;
    }

    .hat-card.correct .result-icon.fa-circle-check {
        color: #2ecc71;
        opacity: 1;
        transform: scale(1);
    }

    .hat-card.wrong .result-icon.fa-circle-xmark {
        color: #e74c3c;
        opacity: 1;
        transform: scale(1);
    }

    .letters-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        min-height: 120px;
        width: 100%;
        background: rgba(255,255,255,.4);
        padding: 20px;
        border-radius: 25px;
        backdrop-filter: blur(5px);
    }

    .draggable-card {
        width: 100px;
        height: 100px;
        background: #fff;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: grab;
        box-shadow: 0 6px 12px rgba(0,0,0,.15);
        transition: transform .16s, box-shadow .16s;
        touch-action: none;
    }

    .draggable-card:active {
        cursor: grabbing;
    }

    .draggable-card img {
        width: 80%;
        height: 80%;
        object-fit: contain;
        pointer-events: none;
    }

    .draggable-card.dragging {
        visibility: hidden;
    }

    /* Floating card follows the pointer/finger */
    .drag-ghost {
        position: fixed;
        left: 0;
        top: 0;
        width: 100px;
        height: 100px;
        transform: translate(-50%, -50%) scale(1.08);
        background: #fff;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 14px 28px rgba(0,0,0,.25);
        pointer-events: none;
        z-index: 9999;
    }

    .drag-ghost img {
        width: 80%;
        height: 80%;
        object-fit: contain;
    }

    .controls-container {
        display: flex;
        gap: 20px;
        margin-top: 4px;
    }

    .icon-btn {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: none;
        outline: none;
        cursor: pointer;
        font-size: 2rem;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 15px rgba(0,0,0,.2);
        transition: transform .2s, background-color .2s;
        touch-action: manipulation;
    }

    .icon-btn:hover {
        transform: translateY(-3px) scale(1.05);
    }

    .icon-btn:active {
        transform: translateY(2px) scale(.95);
    }

    .check-btn { background-color: #2ecc71; }
    .check-btn:hover { background-color: #27ae60; }

    .reset-btn { background-color: #3498db; }
    .reset-btn:hover { background-color: #2980b9; }

    .icon-btn:disabled {
        background-color: #bdc3c7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    @media (max-width: 600px) {
        body { padding: 10px; }
        .set-selector { gap: 7px; }
        .set-btn { width: 31%; height: 48px; font-size: 1.08rem; padding: 2px 4px; }
        .hat-card { width: 128px; height: 165px; }
        .hat-img { width: 120px; height: 120px; }
        .drop-zone { width: 105px; height: 72px; }
        .draggable-card { width: 82px; height: 82px; }
        .drag-ghost { width: 82px; height: 82px; }
    }
</style>
</head>
<body>

    <h1>Drag and Match</h1>

    <!-- Letter-set buttons -->
    <div class="set-selector" aria-label="Choose a letter set">
        <button class="set-btn active" id="set-abtn" title="Letters A to E" aria-label="Letters A to E">Aa-Ee</button>
        <button class="set-btn" id="set-fjbtn" title="Letters F to J" aria-label="Letters F to J">Ff-Jj</button>
        <button class="set-btn" id="set-randbtn" title="Random five letters from A to Z" aria-label="Random five letters from A to Z">Aa-Zz</button>
    </div>

    <div class="header-container">
        <div class="score-board">
            <div class="score-item correct">
                <i class="fa-solid fa-thumbs-up"></i>
                <span id="score-right">0</span>
            </div>
            <div class="score-item wrong">
                <i class="fa-solid fa-thumbs-down"></i>
                <span id="score-wrong">0</span>
            </div>
        </div>
    </div>

    <div class="game-board">
        <div class="hats-container" id="hats-container"></div>
        <div class="letters-container" id="letters-container"></div>
    </div>

    <div class="controls-container">
        <button class="icon-btn check-btn" id="check-btn" title="Check Answers" aria-label="Check Answers">
            <i class="fa-solid fa-check"></i>
        </button>
        <button class="icon-btn reset-btn" id="reset-btn" title="New Game" aria-label="New Game">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </div>

    <script>
        /* -----------------------------------------------------------
           Alphabet data
           A-E uses the original filenames from the supplied game.
           F-J uses the newly supplied image/audio assets.
        ----------------------------------------------------------- */
        /* Only letters whose picture AND recorded sound have been supplied are
           available to the game. As new letter assets are added, add them here. */
        const suppliedLetters = [
            { id: 'A', img: 'Aa.png', sound: 'a sound.mp3' },
            { id: 'B', img: 'Bb.png', sound: 'b sound.mp3' },
            { id: 'C', img: 'Cc.png', sound: 'c sound.mp3' },
            { id: 'D', img: 'Dd.png', sound: 'd sound.mp3' },
            { id: 'E', img: 'Ee.png', sound: 'e sound.mp3' },
            { id: 'F', img: 'Ff.png', sound: 'Ff sound.mp3' },
            { id: 'G', img: 'Gg.png', sound: 'Gg sound.mp3' },
            { id: 'H', img: 'Hh.png', sound: 'Hh sound.mp3' },
            { id: 'I', img: 'Ii.png', sound: 'Ii sound.mp3' },
            { id: 'J', img: 'Jj.png', sound: 'Jj sound.mp3' }
        ];

        // The random Aa-Zz mode currently means:
        // "Choose 5 random letters from the letters I have downloaded so far."
        // It MUST NOT create or invent K-Z assets.
        const availableLetters = suppliedLetters.slice();

        const letterSets = {
            AtoE: availableLetters.slice(0, 5),
            FtoJ: availableLetters.slice(5, 10)
        };

        const hatImgSrc = '115 Week 3A G3 (8).png';

        let currentSet = 'AtoE';
        let letterData = letterSets[currentSet];
        let matchedPairs = {};
        let scoreRight = 0;
        let scoreWrong = 0;
        let hatOrder = [];

        /* The larger this is, the more forgiving the "magnet" is. */
        const MAGNET_RADIUS = 65;

        /* -----------------------------------------------------------
           Small game sound effects
        ----------------------------------------------------------- */
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSoundEffect(type) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            const now = ctx.currentTime;

            if (type === 'drag') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + .1);
                gain.gain.setValueAtTime(.08, now);
                gain.gain.linearRampToValueAtTime(.01, now + .1);
                osc.start(now);
                osc.stop(now + .1);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(480, now + .15);
                gain.gain.setValueAtTime(.18, now);
                gain.gain.linearRampToValueAtTime(.01, now + .15);
                osc.start(now);
                osc.stop(now + .15);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + .1);
                osc.frequency.setValueAtTime(783.99, now + .2);
                gain.gain.setValueAtTime(.2, now);
                gain.gain.linearRampToValueAtTime(.01, now + .4);
                osc.start(now);
                osc.stop(now + .4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + .15);
                gain.gain.setValueAtTime(.2, now);
                gain.gain.linearRampToValueAtTime(.01, now + .3);
                osc.start(now);
                osc.stop(now + .3);
            }
        }

        function playLetterSound(soundFile) {
            if (!soundFile) return;
            const audio = new Audio(soundFile);
            audio.play().catch(() => {});
        }

        function shuffle(array) {
            return array.slice().sort(() => Math.random() - 0.5);
        }

        /* -----------------------------------------------------------
           Letter-set buttons
        ----------------------------------------------------------- */
        document.getElementById('set-abtn').addEventListener('click', () => switchSet('AtoE'));
        document.getElementById('set-fjbtn').addEventListener('click', () => switchSet('FtoJ'));
        document.getElementById('set-randbtn').addEventListener('click', () => switchSet('RANDOM'));

        function randomFiveLetters() {
            return shuffle(availableLetters).slice(0, Math.min(5, availableLetters.length));
        }

        function switchSet(setName) {
            currentSet = setName;
            letterData = setName === 'RANDOM' ? randomFiveLetters() : letterSets[setName];

            document.getElementById('set-abtn').classList.toggle('active', currentSet === 'AtoE');
            document.getElementById('set-fjbtn').classList.toggle('active', currentSet === 'FtoJ');
            document.getElementById('set-randbtn').classList.toggle('active', currentSet === 'RANDOM');

            initGame();
        }

        /* -----------------------------------------------------------
           Game initialization
        ----------------------------------------------------------- */
        function initGame() {
            const hatsContainer = document.getElementById('hats-container');
            const lettersContainer = document.getElementById('letters-container');

            hatsContainer.innerHTML = '';
            lettersContainer.innerHTML = '';
            matchedPairs = {};

            document.getElementById('check-btn').disabled = false;

            hatOrder = shuffle(letterData);
            const shuffledLetters = shuffle(letterData);

            hatOrder.forEach((item, index) => {
                const hatCard = document.createElement('div');
                hatCard.className = 'hat-card';
                hatCard.dataset.index = index;
                hatCard.dataset.targetLetter = item.id;

                hatCard.innerHTML = `
                    <div class="revealed-letter">
                        <img src="${item.img}" alt="${item.id}">
                    </div>
                    <i class="fa-solid fa-circle-check result-icon"></i>
                    <i class="fa-solid fa-circle-xmark result-icon"></i>
                    <img class="hat-img" src="${hatImgSrc}" alt="Hat">
                    <div class="drop-zone" data-index="${index}"></div>
                `;

                hatsContainer.appendChild(hatCard);

                /* Clicking a hat plays its target letter sound. */
                hatCard.addEventListener('click', (event) => {
                    if (hatCard.dataset.wasDragged === 'true') {
                        hatCard.dataset.wasDragged = 'false';
                        return;
                    }
                    playLetterSound(item.sound, item.id);
                });
            });

            shuffledLetters.forEach(item => {
                lettersContainer.appendChild(createLetterCard(item));
            });
        }

        function createLetterCard(item) {
            const card = document.createElement('div');
            card.className = 'draggable-card';
            card.dataset.id = item.id;
            card.dataset.img = item.img;
            card.dataset.sound = item.sound;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Letter ${item.id}`);
            card.innerHTML = `<img src="${item.img}" alt="${item.id}">`;
            setupPointerDrag(card);
            return card;
        }

        /* -----------------------------------------------------------
           Forgiving pointer/touch dragging

           Instead of native HTML5 drag/drop, this uses Pointer Events.
           On release:
             1) anywhere over the hat picture = valid
             2) near the answer box = valid ("magnetic" pull)
             3) otherwise the card returns to the letter tray
        ----------------------------------------------------------- */
        let dragState = null;

        function setupPointerDrag(card) {
            card.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                if (document.getElementById('check-btn').disabled) return;

                e.preventDefault();
                card.setPointerCapture?.(e.pointerId);

                const rect = card.getBoundingClientRect();
                const ghost = document.createElement('div');
                ghost.className = 'drag-ghost';
                ghost.innerHTML = `<img src="${card.dataset.img}" alt="">`;
                document.body.appendChild(ghost);

                card.classList.add('dragging');

                dragState = {
                    card,
                    ghost,
                    pointerId: e.pointerId,
                    startX: e.clientX,
                    startY: e.clientY,
                    moved: false,
                    target: null
                };

                moveGhost(e.clientX, e.clientY);
                playSoundEffect('drag');
            });

            card.addEventListener('pointermove', (e) => {
                if (!dragState || dragState.card !== card) return;

                if (Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY) > 5) {
                    dragState.moved = true;
                }

                moveGhost(e.clientX, e.clientY);
                updateMagneticTarget(e.clientX, e.clientY);
            });

            card.addEventListener('pointerup', (e) => {
                if (!dragState || dragState.card !== card) return;
                finishPointerDrag(e.clientX, e.clientY, true);
            });

            card.addEventListener('pointercancel', () => {
                if (!dragState || dragState.card !== card) return;
                cancelPointerDrag();
            });
        }

        function moveGhost(x, y) {
            if (!dragState) return;
            dragState.ghost.style.left = `${x}px`;
            dragState.ghost.style.top = `${y}px`;
        }

        function clearMagneticHighlights() {
            document.querySelectorAll('.drop-zone.drag-over').forEach(zone => {
                zone.classList.remove('drag-over');
            });
        }

        function getDropTarget(x, y) {
            const hats = [...document.querySelectorAll('.hat-card')];
            const candidates = [];

            hats.forEach(hat => {
                const hatImg = hat.querySelector('.hat-img');
                const zone = hat.querySelector('.drop-zone');
                const imgRect = hatImg.getBoundingClientRect();
                const zoneRect = zone.getBoundingClientRect();

                const insideHat =
                    x >= imgRect.left && x <= imgRect.right &&
                    y >= imgRect.top && y <= imgRect.bottom;

                const zoneCenterX = zoneRect.left + zoneRect.width / 2;
                const zoneCenterY = zoneRect.top + zoneRect.height / 2;
                const distanceToZone = Math.hypot(x - zoneCenterX, y - zoneCenterY);

                const nearZone = distanceToZone <= Math.max(zoneRect.width, zoneRect.height) / 2 + MAGNET_RADIUS;

                if (insideHat || nearZone) {
                    candidates.push({
                        hat,
                        zone,
                        distance: insideHat ? 0 : distanceToZone
                    });
                }
            });

            candidates.sort((a, b) => a.distance - b.distance);
            return candidates[0] || null;
        }

        function updateMagneticTarget(x, y) {
            clearMagneticHighlights();
            if (!dragState) return;

            const target = getDropTarget(x, y);
            dragState.target = target;

            if (target) {
                target.zone.classList.add('drag-over');
            }
        }

        function finishPointerDrag(x, y, isDrop) {
            if (!dragState) return;

            const state = dragState;
            const target = getDropTarget(x, y);

            clearMagneticHighlights();

            if (isDrop && target) {
                placeLetterInHat(state.card, target.zone, target.hat);
                state.card.remove();
                state.hatDragged = true;
                target.hat.dataset.wasDragged = 'true';
            } else {
                state.card.classList.remove('dragging');
            }

            state.ghost.remove();
            dragState = null;
        }

        function cancelPointerDrag() {
            if (!dragState) return;
            clearMagneticHighlights();
            dragState.card.classList.remove('dragging');
            dragState.ghost.remove();
            dragState = null;
        }

        function placeLetterInHat(card, dropZone, hatCard) {
            const hatIndex = dropZone.dataset.index;
            const letterId = card.dataset.id;

            /* If another letter is already there, return it to the tray. */
            if (dropZone.children.length > 0) {
                const existingImg = dropZone.querySelector('img');
                const existingId = existingImg.dataset.id;
                const existingSrc = existingImg.dataset.src || existingImg.getAttribute('src');

                returnCardToPool(existingId, existingSrc);
                delete matchedPairs[hatIndex];
                dropZone.innerHTML = '';
            }

            const placedImg = document.createElement('img');
            placedImg.src = card.dataset.img;
            placedImg.dataset.id = letterId;
            placedImg.dataset.src = card.dataset.img;
            placedImg.alt = letterId;

            dropZone.appendChild(placedImg);
            matchedPairs[hatIndex] = letterId;

            /* Remove any previous result state if the student changes an answer. */
            hatCard.classList.remove('correct', 'wrong', 'revealed');

            playSoundEffect('drop');
        }

        function returnCardToPool(id, imgSrc) {
            const lettersContainer = document.getElementById('letters-container');
            const card = createLetterCard({
                id,
                img: imgSrc,
                sound: ''
            });
            lettersContainer.appendChild(card);
        }

        /* -----------------------------------------------------------
           Check answers

           Correct letters stay in their hats.
           Incorrect letters are returned to the deck so the student
           can try those hats again.
        ----------------------------------------------------------- */
        document.getElementById('check-btn').addEventListener('click', () => {
            const hatCards = [...document.querySelectorAll('.hat-card')];
            let hasWrong = false;
            let currentRight = 0;
            let currentWrong = 0;

            hatCards.forEach(hatCard => {
                const index = hatCard.dataset.index;
                const targetLetter = hatCard.dataset.targetLetter;
                const userPlacedLetter = matchedPairs[index];
                const dropZone = hatCard.querySelector('.drop-zone');

                if (userPlacedLetter === targetLetter) {
                    /* Correct: lock it visually in place. */
                    hatCard.classList.add('correct', 'revealed');
                    hatCard.classList.remove('wrong');
                    currentRight++;
                } else {
                    /* Wrong or empty: return the student's letter to the deck. */
                    hatCard.classList.remove('correct', 'revealed');

                    if (userPlacedLetter) {
                        const placedImg = dropZone.querySelector('img');

                        if (placedImg) {
                            const imgSrc = placedImg.dataset.src || placedImg.getAttribute('src');
                            const id = placedImg.dataset.id || userPlacedLetter;
                            returnCardToPool(id, imgSrc);
                        }

                        dropZone.innerHTML = '';
                        delete matchedPairs[index];
                    }

                    if (userPlacedLetter) {
                        hatCard.classList.add('wrong');
                        setTimeout(() => hatCard.classList.remove('wrong'), 700);
                        currentWrong++;
                        hasWrong = true;
                    }
                }
            });

            scoreRight += currentRight;
            scoreWrong += currentWrong;

            document.getElementById('score-right').innerText = scoreRight;
            document.getElementById('score-wrong').innerText = scoreWrong;

            const allCorrect =
                Object.keys(matchedPairs).length === letterData.length &&
                !hasWrong;

            if (allCorrect) {
                playSoundEffect('correct');
                document.getElementById('check-btn').disabled = true;
            } else {
                playSoundEffect(hasWrong ? 'wrong' : 'drop');
                /* Keep Check available because the student can try again. */
                document.getElementById('check-btn').disabled = false;
            }
        });

        document.getElementById('reset-btn').addEventListener('click', initGame);

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
